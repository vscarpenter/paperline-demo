<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fieldnotes — Analytics</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./node_modules/paperline/dist/paperline.css" />

<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body { background: var(--pl-paper-0); font-family: var(--pl-font-sans); display: flex; min-height: 100vh; }

  /* Sidebar (shared) */
  .sidebar {
    width: 224px;
    flex-shrink: 0;
    background: var(--pl-paper-card);
    border-right: 1px solid var(--pl-hairline);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 20px 18px 18px; border-bottom: 1px solid var(--pl-hairline); }
  .sidebar-brand .name { font-family: var(--pl-font-serif); font-size: 18px; color: var(--pl-ink-1); }
  .sidebar-brand .badge { margin-left: auto; font-size: 9px; font-weight: 700; background: var(--pl-accent-100); color: var(--pl-accent-700); border-radius: 4px; padding: 2px 6px; }
  .nav-group { padding: 10px 10px 0; }
  .nav-label { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--pl-ink-4); padding: 0 8px; margin-bottom: 4px; }
  .nav-item { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--pl-ink-3); cursor: pointer; text-decoration: none; transition: background var(--pl-dur-1), color var(--pl-dur-1); margin-bottom: 1px; }
  .nav-item:hover { background: var(--pl-paper-1); color: var(--pl-ink-1); }
  .nav-item.active { background: var(--pl-accent-50); color: var(--pl-accent-700); font-weight: 600; }
  .nav-count { margin-left: auto; font-size: 10px; font-weight: 700; font-family: var(--pl-font-mono); background: var(--pl-paper-2); color: var(--pl-ink-3); border-radius: 999px; padding: 1px 6px; }
  .sidebar-footer { margin-top: auto; padding: 14px 10px; border-top: 1px solid var(--pl-hairline); }

  /* Main */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 28px; border-bottom: 1px solid var(--pl-hairline); background: var(--pl-paper-card); position: sticky; top: 0; z-index: 10; }
  .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .content { padding: 28px; display: flex; flex-direction: column; gap: 24px; }

  /* Page header */
  .page-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--pl-ink-4); margin-bottom: 4px; }
  .page-title { font-family: var(--pl-font-serif); font-size: 34px; font-weight: 400; letter-spacing: -0.02em; color: var(--pl-ink-1); margin: 0; line-height: 1; }
  .page-title em { font-style: italic; color: var(--pl-accent-500); }

  /* Stats */
  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }

  /* Cards */
  .card { background: var(--pl-paper-card); border: 1px solid var(--pl-hairline-strong); border-radius: 12px; box-shadow: var(--pl-shadow-xs); overflow: hidden; }
  .card-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px 12px; border-bottom: 1px solid var(--pl-hairline); }
  .card-title { font-size: 13px; font-weight: 600; color: var(--pl-ink-1); display: flex; align-items: center; gap: 7px; }
  .card-body { padding: 16px 20px; }

  /* Grid layouts */
  .two-col { display: grid; grid-template-columns: 1fr 340px; gap: 18px; align-items: start; }
  .three-col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }

  /* Large bar chart */
  .big-bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 140px; }
  .big-bar { flex: 1; border-radius: 4px 4px 0 0; background: var(--pl-accent-100); transition: background var(--pl-dur-1); position: relative; cursor: default; }
  .big-bar.hi { background: var(--pl-accent-400); }
  .big-bar.ok { background: var(--pl-ok-400); }
  .big-bar-labels { display: flex; gap: 8px; margin-top: 6px; }
  .big-bar-labels span { flex: 1; text-align: center; font-family: var(--pl-font-mono); font-size: 9.5px; color: var(--pl-ink-4); }

  /* Donut / ring chart using conic-gradient */
  .ring-chart {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: conic-gradient(
      var(--pl-accent-400) 0% 48%,
      var(--pl-ok-400) 48% 72%,
      var(--pl-info-400) 72% 86%,
      var(--pl-warn-400) 86% 100%
    );
    position: relative;
    flex-shrink: 0;
  }
  .ring-chart::after {
    content: "";
    position: absolute;
    inset: 22px;
    border-radius: 50%;
    background: var(--pl-paper-card);
  }

  /* Sparkline bars (inline mini) */
  .sparkline { display: flex; align-items: flex-end; gap: 2px; height: 28px; }
  .spark { width: 4px; border-radius: 2px 2px 0 0; background: var(--pl-accent-200); }
  .spark.hi { background: var(--pl-accent-500); }

  /* Metric row */
  .metric-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--pl-hairline); }
  .metric-row:last-child { border-bottom: none; }
  .metric-dot { width: 10px; height: 10px; border-radius: 999px; flex-shrink: 0; }
  .metric-label { font-size: 13px; color: var(--pl-ink-2); flex: 1; }
  .metric-value { font-family: var(--pl-font-mono); font-size: 13px; font-weight: 600; color: var(--pl-ink-1); }
  .metric-delta { font-size: 11px; font-family: var(--pl-font-mono); margin-left: 6px; }
  .metric-delta.up { color: var(--pl-ok-500); }
  .metric-delta.down { color: var(--pl-danger-500); }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
</head>
<body class="pl-root">
<div id="root"></div>

<script type="text/babel" src="./node_modules/paperline/dist/paperline-icons.global.jsx"></script>
<script type="text/babel" src="./node_modules/paperline/dist/paperline-components.global.jsx"></script>

<script type="text/babel">
const { useState } = React;

const NavItem = ({ icon: Icon, label, active, count, href = "#" }) => (
  <a className={`nav-item${active ? " active" : ""}`} href={href}>
    <Icon size={14} />
    <span style={{ flex: 1 }}>{label}</span>
    {count !== undefined && <span className="nav-count">{count}</span>}
  </a>
);

const Sparkline = ({ data, highlight }) => (
  <div className="sparkline">
    {data.map((v, i) => (
      <div key={i} className={`spark${i === highlight ? " hi" : ""}`} style={{ height: `${v}%` }} />
    ))}
  </div>
);

const App = () => {
  const [period, setPeriod] = useState("30d");
  const [theme, setTheme] = useState("light");

  React.useEffect(() => {
    document.body.classList.toggle("pl-dark", theme === "dark");
  }, [theme]);

  const topDocs = [
    { title: "Brand Guidelines 2026",   space: "Design",      views: 311, unique: 148, avgTime: "4m 12s", trend: [30,40,55,60,70,80,90,100], trendHi: 7 },
    { title: "Q2 Product Roadmap",      space: "Product",     views: 248, unique: 112, avgTime: "6m 40s", trend: [20,30,50,70,80,85,90,95], trendHi: 7 },
    { title: "Onboarding Checklist",    space: "HR",          views: 193, unique: 88,  avgTime: "3m 05s", trend: [60,65,70,65,72,68,75,80], trendHi: 7 },
    { title: "Engineering Principles",  space: "Engineering", views: 107, unique: 52,  avgTime: "8m 22s", trend: [10,15,20,25,30,35,38,40], trendHi: 7 },
    { title: "Incident Post-mortem #14",space: "Engineering", views: 56,  unique: 34,  avgTime: "5m 48s", trend: [0,0,10,25,40,50,55,56], trendHi: 7 },
  ];

  const barData = [
    { label: "Apr 7",  views: 38, unique: 22, hi: false },
    { label: "Apr 14", views: 52, unique: 31, hi: false },
    { label: "Apr 21", views: 67, unique: 40, hi: false },
    { label: "Apr 28", views: 80, unique: 48, hi: false },
    { label: "May 5",  views: 95, unique: 57, hi: true  },
  ];
  const maxViews = Math.max(...barData.map(d => d.views));

  const spaceColors = {
    Design: "var(--pl-cat-rose)",
    Product: "var(--pl-cat-plum)",
    HR: "var(--pl-cat-moss)",
    Engineering: "var(--pl-cat-blue)",
    Legal: "var(--pl-warn-400)",
  };

  return (
    <div style={{ display: "flex", minHeight: "100vh" }}>

      {/* Sidebar */}
      <nav className="sidebar">
        <div className="sidebar-brand">
          <I.Logo size={24} />
          <span className="name">Fieldnotes</span>
          <span className="badge">BETA</span>
        </div>
        <div className="nav-group">
          <NavItem icon={I.Home}      label="Home"      href="dashboard.html" />
          <NavItem icon={I.Book}      label="My docs"   count={12} />
          <NavItem icon={I.Inbox}     label="Inbox"     count={3} />
          <NavItem icon={I.Search}    label="Search" />
        </div>
        <div className="nav-group" style={{ marginTop: 8 }}>
          <div className="nav-label">Spaces</div>
          <NavItem icon={I.Briefcase} label="Product" />
          <NavItem icon={I.Layers}    label="Engineering" />
          <NavItem icon={I.Flag}      label="Design" />
          <NavItem icon={I.Megaphone} label="Marketing" />
          <NavItem icon={I.Shield}    label="Legal" />
        </div>
        <div className="sidebar-footer">
          <NavItem icon={I.Calendar}  label="Analytics"  active href="analytics.html" />
          <NavItem icon={I.Briefcase} label="Team"        href="team.html" />
          <NavItem icon={I.Settings}  label="Settings" />
          <div style={{ padding: "12px 10px 2px", display: "flex", alignItems: "center", gap: 10 }}>
            <PLAvatar name="VC" color="var(--pl-cat-plum)" size={28} />
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 12.5, fontWeight: 600, color: "var(--pl-ink-1)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>Vinny Carpenter</div>
              <div style={{ fontSize: 11, color: "var(--pl-ink-4)" }}>Admin</div>
            </div>
          </div>
        </div>
      </nav>

      {/* Main */}
      <div className="main">

        {/* Topbar */}
        <header className="topbar">
          <PLBreadcrumbs items={[
            { label: "Fieldnotes", href: "index.html" },
            { label: "Analytics" },
          ]} />
          <div className="topbar-actions">
            <PLTabs
              items={[
                { value: "7d",  label: "7d"  },
                { value: "30d", label: "30d" },
                { value: "90d", label: "90d" },
                { value: "all", label: "All" },
              ]}
              value={period}
              onChange={setPeriod}
            />
            <PLButton kind="ghost" onClick={() => setTheme(t => t === "light" ? "dark" : "light")} aria-label="Toggle theme">
              {theme === "light" ? <I.Moon size={14} /> : <I.Sun size={14} />}
            </PLButton>
            <PLButton kind="secondary" icon={I.Download} size="sm">Export CSV</PLButton>
          </div>
        </header>

        {/* Content */}
        <div className="content">

          {/* Page heading */}
          <div>
            <div className="page-eyebrow">Analytics · May 2026</div>
            <h1 className="page-title">Workspace <em>insights.</em></h1>
          </div>

          {/* Stats */}
          <div className="stats-row">
            <PLStat label="Total page views"  value="1,847"  delta="+23% vs prev. period"  tone="ok"     />
            <PLStat label="Unique readers"    value="312"    delta="+18% vs prev. period"  tone="ok"     />
            <PLStat label="Avg. read time"    value="4m 38s" delta="-0:22 vs prev. period" tone="neutral" />
            <PLStat label="Docs published"    value="34"     delta="+8 this period"        tone="accent"  />
          </div>

          {/* Views over time + space breakdown */}
          <div className="two-col">

            {/* Bar chart */}
            <div className="card">
              <div className="card-header">
                <span className="card-title"><I.Calendar size={13} /> Page views over time</span>
                <PLBadge tone="ok" dot>+23% growth</PLBadge>
              </div>
              <div className="card-body">
                <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
                  {[
                    { label: "Views",   color: "var(--pl-accent-400)" },
                    { label: "Unique",  color: "var(--pl-ok-400)" },
                  ].map(({ label, color }) => (
                    <div key={label} style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11.5, color: "var(--pl-ink-3)" }}>
                      <div style={{ width: 10, height: 10, borderRadius: 2, background: color }} />
                      {label}
                    </div>
                  ))}
                </div>
                <div className="big-bar-chart">
                  {barData.map((d, i) => (
                    <React.Fragment key={d.label}>
                      <div
                        className={`big-bar${d.hi ? " hi" : ""}`}
                        style={{ height: `${(d.views / maxViews) * 100}%` }}
                        title={`${d.label}: ${d.views} views`}
                      />
                      <div
                        className="big-bar ok"
                        style={{ height: `${(d.unique / maxViews) * 100}%`, opacity: 0.8 }}
                        title={`${d.label}: ${d.unique} unique`}
                      />
                    </React.Fragment>
                  ))}
                </div>
                <div className="big-bar-labels">
                  {barData.map(d => (
                    <React.Fragment key={d.label}>
                      <span>{d.label}</span>
                      <span></span>
                    </React.Fragment>
                  ))}
                </div>
                <PLDivider style={{ margin: "16px 0 12px" }} />
                <div style={{ display: "flex", gap: 24 }}>
                  {[
                    { label: "Peak day",    value: "May 5",   sub: "95 views" },
                    { label: "Best week",   value: "Apr 28",  sub: "↑ 342 views" },
                    { label: "Avg / day",   value: "61.6",    sub: "views" },
                  ].map(({ label, value, sub }) => (
                    <div key={label}>
                      <div style={{ fontSize: 11, color: "var(--pl-ink-4)", marginBottom: 2 }}>{label}</div>
                      <div style={{ fontSize: 16, fontWeight: 700, fontFamily: "var(--pl-font-mono)", color: "var(--pl-ink-1)" }}>{value}</div>
                      <div style={{ fontSize: 10.5, color: "var(--pl-ink-4)" }}>{sub}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* Space breakdown */}
            <div className="card">
              <div className="card-header">
                <span className="card-title"><I.Layers size={13} /> Views by space</span>
              </div>
              <div className="card-body">
                <div style={{ display: "flex", alignItems: "center", gap: 20 }}>
                  <div className="ring-chart" />
                  <div style={{ flex: 1, fontSize: 12, color: "var(--pl-ink-3)" }}>
                    <div style={{ fontWeight: 600, color: "var(--pl-ink-1)", marginBottom: 6, fontSize: 13 }}>1,847 total views</div>
                    <div>Distributed across 5 active spaces in the current period.</div>
                  </div>
                </div>
                <PLDivider style={{ margin: "14px 0" }} />
                {[
                  { space: "Design",      pct: 48, views: 887,  delta: "+31%", up: true  },
                  { space: "Product",     pct: 24, views: 443,  delta: "+18%", up: true  },
                  { space: "Engineering", pct: 14, views: 258,  delta: "-4%",  up: false },
                  { space: "HR",          pct: 9,  views: 166,  delta: "+11%", up: true  },
                  { space: "Legal",       pct: 5,  views: 93,   delta: "0%",   up: false },
                ].map(({ space, pct, views, delta, up }) => (
                  <div key={space} className="metric-row">
                    <div className="metric-dot" style={{ background: spaceColors[space] }} />
                    <div className="metric-label">{space}</div>
                    <PLProgress value={pct} style={{ width: 60 }} />
                    <div className="metric-value" style={{ minWidth: 40, textAlign: "right" }}>{views}</div>
                    <span className={`metric-delta ${up ? "up" : "down"}`}>{delta}</span>
                  </div>
                ))}
              </div>
            </div>

          </div>

          {/* Top documents */}
          <div className="card">
            <div className="card-header">
              <span className="card-title"><I.Book size={13} /> Top documents</span>
              <PLButton kind="secondary" size="sm" icon={I.Filter}>Filter</PLButton>
            </div>
            <div>
              <PLTable
                columns={[
                  {
                    key: "title",
                    label: "Document",
                    render: r => (
                      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                        <PLAvatar name={r.space.slice(0,2)} color={spaceColors[r.space]} size={24} />
                        <div>
                          <div style={{ fontSize: 13, fontWeight: 600, color: "var(--pl-ink-1)" }}>{r.title}</div>
                          <div style={{ fontSize: 11, color: "var(--pl-ink-4)", fontFamily: "var(--pl-font-mono)" }}>{r.space}</div>
                        </div>
                      </div>
                    ),
                  },
                  {
                    key: "views",
                    label: "Views",
                    render: r => <span style={{ fontFamily: "var(--pl-font-mono)", fontSize: 13, fontWeight: 600, color: "var(--pl-ink-1)" }}>{r.views}</span>,
                  },
                  {
                    key: "unique",
                    label: "Unique readers",
                    render: r => <span style={{ fontFamily: "var(--pl-font-mono)", fontSize: 12, color: "var(--pl-ink-3)" }}>{r.unique}</span>,
                  },
                  {
                    key: "avgTime",
                    label: "Avg. read time",
                    render: r => <span style={{ fontFamily: "var(--pl-font-mono)", fontSize: 12, color: "var(--pl-ink-3)" }}>{r.avgTime}</span>,
                  },
                  {
                    key: "trend",
                    label: "30-day trend",
                    render: r => <Sparkline data={r.trend} highlight={r.trendHi} />,
                  },
                ]}
                rows={topDocs}
              />
            </div>
          </div>

          {/* Three smaller metric cards */}
          <div className="three-col">

            {/* Engagement */}
            <div className="card">
              <div className="card-header">
                <span className="card-title"><I.Flag size={13} /> Engagement</span>
                <PLBadge tone="ok" dot>Good</PLBadge>
              </div>
              <div className="card-body">
                {[
                  { label: "Comment rate",  value: "14.2%", delta: "+2.1%", up: true  },
                  { label: "Share rate",    value: "6.8%",  delta: "+0.9%", up: true  },
                  { label: "Bounce rate",   value: "22.4%", delta: "-3.2%", up: true  },
                  { label: "Return visits", value: "41%",   delta: "+5%",   up: true  },
                ].map(({ label, value, delta, up }) => (
                  <div key={label} className="metric-row">
                    <div className="metric-label">{label}</div>
                    <div className="metric-value">{value}</div>
                    <span className={`metric-delta ${up ? "up" : "down"}`}>{delta}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Top authors */}
            <div className="card">
              <div className="card-header">
                <span className="card-title"><I.Briefcase size={13} /> Top authors</span>
              </div>
              <div className="card-body">
                {[
                  { name: "Maya Tanaka",  initials: "MT", color: "var(--pl-cat-rose)",  docs: 9, views: 631 },
                  { name: "Hira Soltani", initials: "HS", color: "var(--pl-cat-plum)",  docs: 7, views: 443 },
                  { name: "Jonas Reyes",  initials: "JR", color: "var(--pl-cat-blue)",  docs: 5, views: 318 },
                  { name: "Eli Berg",     initials: "EB", color: "var(--pl-cat-moss)",  docs: 4, views: 207 },
                ].map(({ name, initials, color, docs, views }) => (
                  <div key={name} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 0", borderBottom: "1px solid var(--pl-hairline)" }}>
                    <PLAvatar name={initials} color={color} size={28} />
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 13, fontWeight: 600, color: "var(--pl-ink-1)" }}>{name}</div>
                      <div style={{ fontSize: 11, color: "var(--pl-ink-4)" }}>{docs} docs</div>
                    </div>
                    <div style={{ fontFamily: "var(--pl-font-mono)", fontSize: 12, color: "var(--pl-ink-2)", fontWeight: 600 }}>{views}<span style={{ fontWeight: 400, color: "var(--pl-ink-4)", marginLeft: 2 }}>views</span></div>
                  </div>
                ))}
              </div>
            </div>

            {/* Search terms */}
            <div className="card">
              <div className="card-header">
                <span className="card-title"><I.Search size={13} /> Top searches</span>
                <PLBadge tone="info">Last 30 days</PLBadge>
              </div>
              <div className="card-body">
                {[
                  { term: "onboarding",      count: 84, pct: 90 },
                  { term: "brand guidelines", count: 71, pct: 76 },
                  { term: "roadmap",         count: 58, pct: 62 },
                  { term: "incident",        count: 43, pct: 46 },
                  { term: "API",             count: 37, pct: 40 },
                  { term: "engineering",     count: 29, pct: 31 },
                ].map(({ term, count, pct }) => (
                  <div key={term} style={{ display: "flex", alignItems: "center", gap: 10, padding: "7px 0", borderBottom: "1px solid var(--pl-hairline)" }}>
                    <PLTag>{term}</PLTag>
                    <PLProgress value={pct} style={{ flex: 1 }} />
                    <span style={{ fontFamily: "var(--pl-font-mono)", fontSize: 11.5, color: "var(--pl-ink-3)", minWidth: 24, textAlign: "right" }}>{count}</span>
                  </div>
                ))}
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
